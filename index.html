<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Professional Task Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Application Container -->
  <div class="app-container">

    <!-- 1. AUTHENTICATION VIEW (Login / Register) -->
    <main id="auth-view" class="auth-view">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
            <span>TaskFlow</span>
          </div>
          <p id="auth-subtitle">Welcome back! Please enter your details.</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
          <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="input-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-block">
            <span>Sign In</span>
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="input-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="johndoe" required autocomplete="username">
          </div>
          <div class="input-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="input-group">
            <label for="reg-password">Password (min 6 chars)</label>
            <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" id="register-btn" class="btn btn-primary btn-block">
            <span>Create Account</span>
          </button>
        </form>
      </div>
    </main>

    <!-- 2. DASHBOARD VIEW (Authenticated User Area) -->
    <main id="app-view" class="dashboard-view hidden">

      <!-- Navigation Header -->
      <header class="navbar">
        <div class="nav-brand">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <h2>TaskFlow</h2>
        </div>

        <div class="user-profile">
          <div class="avatar" id="user-avatar">U</div>
          <span class="username" id="user-display-name">User</span>
          <button class="btn-logout" onclick="handleLogout()" title="Log Out">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <!-- Main Dashboard Content -->
      <div class="dashboard-content">

        <!-- Stats Overview Cards -->
        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon total">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Tasks</span>
              <h3 class="stat-value" id="stat-total">0</h3>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon pending">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Active Tasks</span>
              <h3 class="stat-value" id="stat-pending">0</h3>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon completed">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Completed</span>
              <h3 class="stat-value" id="stat-completed">0</h3>
            </div>
          </div>
        </section>

        <!-- Task Creator Input Card -->
        <section class="task-creator-card">
          <form onsubmit="handleAddTask(event)" class="task-creator-form">
            <input type="text" id="new-task-title" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>Add Task</span>
            </button>
          </form>
        </section>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar">
          <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All Tasks</button>
            <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
            <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">Completed</button>
          </div>

          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search tasks..." oninput="handleSearch(event)">
          </div>
        </section>

        <!-- Task List Section -->
        <section class="tasks-container">
          <!-- Loading Spinner -->
          <div id="tasks-loading" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Loading your tasks...</p>
          </div>

          <!-- Empty State -->
          <div id="tasks-empty" class="empty-state hidden">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg>
            </div>
            <h4 id="empty-title">No tasks found</h4>
            <p id="empty-desc">Your task list is empty. Add a task to get started!</p>
          </div>

          <!-- Task List UL -->
          <ul id="task-list" class="task-list"></ul>
        </section>

      </div>
    </main>
  </div>

  <!-- Edit Task Modal Overlay -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form onsubmit="handleSaveEdit(event)" class="modal-form">
        <div class="input-group">
          <label for="edit-task-title">Task Title</label>
          <input type="text" id="edit-task-title" required autocomplete="off">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
